[package]
name = "tesseld"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "tesseld"
path = "src/lib.rs"

[[bin]]
name = "tesseld"
path = "src/main.rs"

[dependencies]
tessel-proto.workspace = true
tessel-agent.workspace = true
tessel-term.workspace = true
tessel-remote = { path = "../tessel-remote" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
libc = "0.2"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
# a workspace's settings file, and which gitignored files it gets a copy of.
# both already in the build.
toml = "0.8"
globset = "0.4"
serde_yaml_ng = "0.10"
regex = "1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
webpki-roots = "1"

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
tessel-client = { path = "../tessel-client" }
