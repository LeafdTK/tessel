[package]
name = "tesseld"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "tesseld"
path = "src/lib.rs"

[[bin]]
name = "tesseld"
path = "src/main.rs"

[dependencies]
tessel-proto.workspace = true
tessel-agent.workspace = true
tessel-term.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
libc = "0.2"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
tessel-client = { path = "../tessel-client" }
