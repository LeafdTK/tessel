[package]
name = "photond"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "photond"
path = "src/lib.rs"

[[bin]]
name = "photond"
path = "src/main.rs"

[dependencies]
photon-proto.workspace = true
photon-agent.workspace = true
photon-term.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
photon-client = { path = "../photon-client" }
