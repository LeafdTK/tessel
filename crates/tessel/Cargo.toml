[package]
name = "tessel"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "tessel"
path = "src/lib.rs"

[[bin]]
name = "tessel"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
tessel-proto.workspace = true
tessel-term.workspace = true
tessel-client = { path = "../tessel-client" }
tessel-remote = { path = "../tessel-remote" }
tokio.workspace = true
uuid.workspace = true
serde_json.workspace = true
base64 = "0.22"
# clock times for turns ("8:04 PM"); already in the build with this feature.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# only for its Frame type, which gpui takes images as. no features of its own:
# gpui already picks them, and adding any would rebuild the ui stack.
image = { version = "0.25", default-features = false }
# drawing mermaid diagrams and maths. on by default; it only exists as a
# feature so the app can be built without the two renderer crates. switching
# it changes a feature on hashbrown, which rebuilds the whole ui stack
# (several GB), so pick one setting and always build with `--workspace`.
tessel-rich = { path = "../tessel-rich", optional = true }

[features]
default = ["rich"]
rich = ["dep:tessel-rich"]

[target.'cfg(target_os = "macos")'.dependencies]
# the notch: how big it is, and a window over the menu bar around it. both are
# already in the build through gpui, with these same features.
objc2 = "0.6"
block2 = "0.6"
raw-window-handle = "0.6"
