[package]
name = "tessel-rich"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# both renderers are pre-1.0 in spirit and move fast; pinned so an upstream
# release cannot change what a transcript looks like behind our back.
merman = { version = "=0.9.3", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"] }
mathra = { version = "=1.12.0", default-features = false }
# same versions and features gpui already builds, so these cost no extra compile.
usvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
rustybuzz = "0.20"
serde_json.workspace = true

[dev-dependencies]
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
