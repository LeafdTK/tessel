[package]
name = "tessel-remote"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
tessel-proto.workspace = true
tessel-client = { path = "../tessel-client" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
libc = "0.2"
base64 = "0.22"
# quic, as tern does it: quinn over rustls with ring. ring because it builds
# for linux with zig as easily as for the mac; aws-lc doesn't.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
# websockets, for hosts behind an https proxy (vercel sandboxes): tls by
# rustls with ring, as for quic, so it builds for linux the same way.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# what tern does: quic between keys, through any nat. both sides dial out to a
# relay and punch a direct path when the nats allow (they do for vercel's).
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "portmapper", "fast-apple-datapath"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tempfile = "3"
