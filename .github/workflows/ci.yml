name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "assets/**", ".release-please-manifest.json"]
  pull_request:
    paths-ignore: ["**.md", "assets/**", ".release-please-manifest.json"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # only the public repository (elsewhere a macOS runner costs minutes), and
    # not release pull requests: they only change the version and the changelog.
    if: github.repository == 'LeafdTK/tessel' && !startsWith(github.head_ref, 'release-please--')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # the terminal core is built with zig.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - run: rustup show active-toolchain

      # kept even when a run fails, so the next one doesn't start cold.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Test
        run: cargo test --profile ci -p tessel -p tesseld -p tesselctl -p tessel-proto -p tessel-client -p tessel-agent -p tessel-term
