[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
publish = false

[workspace.dependencies]
tessel-proto = { path = "crates/tessel-proto" }
tessel-agent = { path = "crates/tessel-agent" }
tessel-term = { path = "crates/tessel-term" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "signal", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }

# terminals: ghostty's own emulator core. pre-1.0, so pinned exactly. building
# it needs zig 0.15 on PATH: `export PATH="$(brew --prefix zig@0.15)/bin:$PATH"`.
libghostty-vt = "=0.2.2"

# ui stack: gpui-kit pins the matching gpui-pre snapshot and gpui-component.
# bump on purpose, never with a caret.
# test-support is on for every build, not only tests. cargo would otherwise
# compile the whole ui stack twice (once with, once without), which is several
# gigabytes this machine does not have. cost: the library evaluates computed
# style once more for elements marked for tests. revisit when disk allows.
gpui-kit = { version = "=0.9.1", features = ["test-support"] }

[profile.dev]
debug = "line-tables-only"
# the incremental cache costs over a gigabyte here; see the note on disk above.
incremental = false

# the app is built optimized even in dev, so frame-time measurements mean
# something without needing a second (release) build of everything.
[profile.dev.package.tessel]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

# ghostty's build picks zig's Debug mode whenever cargo builds with debug info,
# and Debug ghostty parses terminal output thousands of times slower. without
# debug info here it builds ReleaseFast, in dev too.
[profile.dev.package.libghostty-vt-sys]
debug = false

# what CI tests with: compiled fast, not run fast. tests don't need
# optimized code, and the ui stack optimized is most of a cold build.
[profile.ci]
inherits = "dev"
debug = false

[profile.ci.package."*"]
opt-level = 0

[profile.ci.package.tessel]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 4
